<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- DATA CENTER WARS 2109 — desktop mark.
     A rack under the HUD's own scan brackets, in the HUD's own phosphor green
     (HUDPalette.BRIGHT / DIM). No wordmark: three letters are a smear at the
     16px Windows draws in the taskbar, and the shape has to survive that. -->
<rect x="0" y="0" width="256" height="256" rx="46" fill="#080C0A"/>
<rect x="6" y="6" width="244" height="244" rx="41" fill="none" stroke="#3F6349" stroke-width="10"/>
<g stroke="#9EF2A8" stroke-width="13" fill="none" stroke-linecap="square">
<path d="M46 80 V46 H80"/><path d="M176 46 H210 V80"/>
<path d="M210 176 V210 H176"/><path d="M80 210 H46 V176"/>
</g>
<g fill="#9EF2A8">
<rect x="82" y="80" width="56" height="17" rx="4"/><rect x="150" y="80" width="24" height="17" rx="4"/>
<rect x="82" y="119" width="24" height="17" rx="4"/><rect x="118" y="119" width="56" height="17" rx="4"/>
<rect x="82" y="158" width="56" height="17" rx="4"/><rect x="150" y="158" width="24" height="17" rx="4"/>
</g></svg>
